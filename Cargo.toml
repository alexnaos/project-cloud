[package]
name = "project-cloud"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8.0", features = ["nightly"] }
leptos_router = { version = "0.8.0", features = ["nightly"] }
leptos_meta = { version = "0.8.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen-futures = "0.4.80"
gloo-net = { version = "0.7.0", features = ["json"] }
web-sys = { version = "0.3.107", features = ["Window", "Document", "HtmlElement", "Blob", "Url", "Element"] }
js-sys = "0.3.107"

# ИСПРАВЛЕННЫЙ ZIP: берем только чистый Rust (deflate), без C-компилятора (zstd)
zip = { version = "2.2", default-features = false, features = ["deflate"] }

# Библиотеки для будущих шагов (пока закомментированы, чтобы не мешать сборке)
# leptos-column-browser = "0.1"
# s-zip = { version = "0.15", features = ["async"] }
# opendal = { version = "0.56", features = ["services-gdrive", "services-yandex-disk"] }

# Серверные зависимости (используются только при сборке бэкенда)
axum = { version = "0.8.0", optional = true }
leptos_axum = { version = "0.8.0", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2.106", optional = true }
reqwest = { version = "0.13.5", features = ["json"] }
walkdir = "2.5.0"

[features]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:leptos_axum",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

# Defines a size-optimized profile for the WASM bundle in release mode
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
output-name = "project-cloud"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.scss"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
end2end-cmd = "npx playwright test"
end2end-dir = "end2end"
browserquery = "defaults"
env = "DEV"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
